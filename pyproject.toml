[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "phylogfn"
version = "0.1.0"
description = "Residue-aware conditional GFlowNet for protein gene-tree topology inference"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
esm = [
  "torch>=2.2",
  "transformers>=4.44,<5",
]
gfn = [
  "torch>=2.2",
]
dev = [
  "pytest>=8",
]

[project.scripts]
prepare-phylo-data = "phylogfn.data.prepare:main"
encode-esm2 = "phylogfn.data.esm2_encode:main"
score-parsimony = "phylogfn.phylo.parsimony:main"
train-phylogfn = "phylogfn.train:main"
sample-phylogfn = "phylogfn.sample:main"
evaluate-phylogfn = "phylogfn.evaluation:main"
simulate-phylo-data = "phylogfn.data.simulate:main"
build-nj-tree = "phylogfn.phylo.baseline:main"
compare-phylo-trees = "phylogfn.phylo.tree_metrics:main"
score-likelihood = "phylogfn.phylo.likelihood:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
